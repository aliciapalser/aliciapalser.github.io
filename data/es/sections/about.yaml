designation: Full Stack Developer

summary: |
  Soy desarrolladora full stack con un perfil versátil y una sólida especialización en **backend con Node.js**, con especial atención a las buenas prácticas y al testing.  
  A lo largo de mi trayectoria he participado en proyectos muy diversos: desde **desarrollo orientado a producto** hasta integraciones con sistemas externos, en las que, además de la parte técnica, he asumido la organización de tareas del equipo y la coordinación con el cliente final.  
  También he llevado a cabo tareas de análisis e implementación en plataformas CRM y ERP con otros lenguajes, como Java y PHP.
  
  Actualmente me estoy especializando en **desarrollo agéntico** con herramientas como Claude Code, aplicando mi experiencia y mi enfoque en la calidad de código.  

