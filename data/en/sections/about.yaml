designation: Full Stack Developer

summary: |
  I am a full stack developer with a versatile profile and a strong specialization in **backend with Node.js**, with particular attention to best practices and testing.  
  Throughout my career I have taken part in very diverse projects: from **product-oriented development** to integrations with external systems, where, beyond the technical work, I took on organizing the team's tasks and coordinating with the end client.  
  I have also carried out analysis and implementation on CRM and ERP platforms in other languages, such as Java and PHP.

  I am currently specializing in **agentic development** with tools such as Claude Code, applying my experience and my focus on code quality.

