designation: Full Stack Developer

summary: |
  I am a full stack developer with a versatile background and a strong specialization in **backend development with Node.js**, with a strong focus on best practices and testing.
  Throughout my career I have worked on a wide range of projects, from **product-oriented development** to integrations with external systems, where, beyond the technical work, I took on responsibility for organizing team tasks and coordinating with the end client.
  I have also worked on the analysis and implementation of CRM and ERP platforms using other languages, such as Java and PHP.

  I am currently specializing in **agentic development** with tools such as Claude Code, where I apply my experience and focus on code quality.  
  
